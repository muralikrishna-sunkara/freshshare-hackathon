name: Infrastructure (Terraform)

# PR:          fmt, validate, tflint, offline tests, plan (comment on the PR)
# push main:   plan, then apply in the protected "dev" environment
# manual:      plan or apply on demand

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false # never interrupt a running apply

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  WORKDIR: infra/terraform/envs/dev

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: terraform validate + test (mocked, no AWS access)
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        working-directory: infra/terraform
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"

  plan:
    name: Plan
    needs: checks
    runs-on: ubuntu-latest
    # Skips cleanly until the AWS bootstrap is done and the variables exist
    if: vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    permissions:
      contents: read
      id-token: write       # OIDC to AWS
      pull-requests: write  # plan comment
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        env:
          TF_VAR_ops_alert_emails: ${{ vars.OPS_ALERT_EMAILS || '[]' }}
          TF_VAR_domain_name: ${{ vars.APP_DOMAIN || '' }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID || '' }}
          TF_VAR_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN || '' }}
        run: |
          set +e
          terraform plan -lock=false -detailed-exitcode -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo '### Terraform plan (dev)'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`${process.env.WORKDIR}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(-60000);
            const marker = '<!-- terraform-plan-dev -->';
            const body = `${marker}\n### Terraform plan: dev\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    if: >-
      needs.plan.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.action == 'apply')
    environment:
      name: dev   # add required reviewers on this environment for a manual gate
      url: ${{ steps.out.outputs.app_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # Re-plans under the apply role rather than reusing the plan artifact, so
      # nothing sensitive is uploaded as an artifact.
      - name: terraform apply
        working-directory: ${{ env.WORKDIR }}
        env:
          TF_VAR_ops_alert_emails: ${{ vars.OPS_ALERT_EMAILS || '[]' }}
          TF_VAR_domain_name: ${{ vars.APP_DOMAIN || '' }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID || '' }}
          TF_VAR_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN || '' }}
        run: terraform apply -auto-approve -no-color

      - name: Outputs
        id: out
        working-directory: ${{ env.WORKDIR }}
        run: |
          url=$(terraform output -raw app_url)
          echo "app_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed infrastructure"
            echo "- App URL: $url"
            echo "- Dashboard: $(terraform output -raw cloudwatch_dashboard)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test hello-world
        run: |
          url="${{ steps.out.outputs.app_url }}"
          for i in $(seq 1 30); do
            if curl -fsS "$url/api/health"; then echo; echo "healthy"; exit 0; fi
            echo "waiting for targets ($i/30)..."; sleep 20
          done
          echo "::error::$url/api/health did not become healthy"; exit 1
