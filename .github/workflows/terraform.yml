name: Infrastructure (Terraform)

# PR:          fmt, validate, tflint, offline tests, plan (comment on the PR)
# push main:   plan + apply in the protected "dev" environment
# manual:      plan or apply on demand
#
# AWS settings are read from GitHub variables OR secrets, at repository or
# "dev" environment level: TF_STATE_BUCKET, AWS_PLAN_ROLE_ARN (PR plans),
# AWS_APPLY_ROLE_ARN (main / manual runs).

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false # never interrupt a running apply

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  WORKDIR: infra/terraform/envs/dev

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: terraform validate + test (mocked, no AWS access)
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        working-directory: infra/terraform
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"

  # Pull requests: read-only plan posted as a PR comment
  plan:
    name: Plan (PR)
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC to AWS
      pull-requests: write  # plan comment
    env:
      ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN || secrets.AWS_PLAN_ROLE_ARN }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET }}
    steps:
      - name: Check AWS configuration
        id: cfg
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$STATE_BUCKET" ]; then
            echo "::warning::AWS_PLAN_ROLE_ARN / TF_STATE_BUCKET not set at repository level; skipping the PR plan (see infra/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: hashicorp/setup-terraform@v3
        if: steps.cfg.outputs.ready == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        if: steps.cfg.outputs.ready == 'true'
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform plan
        if: steps.cfg.outputs.ready == 'true'
        working-directory: ${{ env.WORKDIR }}
        env:
          TF_VAR_ops_alert_emails: ${{ vars.OPS_ALERT_EMAILS || '[]' }}
          TF_VAR_domain_name: ${{ vars.APP_DOMAIN || '' }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID || '' }}
          TF_VAR_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN || '' }}
          TF_VAR_ses_sandbox_recipients: ${{ vars.SES_SANDBOX_RECIPIENTS || '[]' }}
        run: |
          set +e
          terraform plan -lock=false -no-color > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          exit $code

      - name: Comment plan on PR
        if: always() && steps.cfg.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try { plan = fs.readFileSync(`${process.env.WORKDIR}/plan.txt`, 'utf8'); } catch { plan = 'plan did not run'; }
            if (plan.length > 60000) plan = plan.slice(-60000);
            const marker = '<!-- terraform-plan-dev -->';
            const body = `${marker}\n### Terraform plan: dev\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # main / manual: plan and (optionally) apply inside the protected "dev"
  # environment, so environment-level variables and approvals apply.
  deploy:
    name: ${{ (github.event_name == 'push' || inputs.action == 'apply') && 'Plan and apply (dev)' || 'Plan (dev)' }}
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: dev   # add required reviewers on this environment for a manual gate
      url: ${{ steps.out.outputs.app_url }}
    permissions:
      contents: read
      id-token: write
    env:
      ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN || secrets.AWS_APPLY_ROLE_ARN }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET }}
      DO_APPLY: ${{ github.event_name == 'push' || inputs.action == 'apply' }}
      TF_VAR_ops_alert_emails: ${{ vars.OPS_ALERT_EMAILS || '[]' }}
      TF_VAR_domain_name: ${{ vars.APP_DOMAIN || '' }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID || '' }}
      TF_VAR_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN || '' }}
      TF_VAR_ses_sandbox_recipients: ${{ vars.SES_SANDBOX_RECIPIENTS || '[]' }}
    steps:
      - name: Check AWS configuration
        run: |
          missing=""
          [ -z "$ROLE_ARN" ] && missing="$missing AWS_APPLY_ROLE_ARN"
          [ -z "$STATE_BUCKET" ] && missing="$missing TF_STATE_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub variable/secret:$missing (repository or 'dev' environment level). See infra/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo '### Terraform plan (dev)'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        if: env.DO_APPLY == 'true' && steps.plan.outputs.has_changes == 'true'
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -no-color tfplan

      - name: Outputs
        id: out
        if: env.DO_APPLY == 'true'
        working-directory: ${{ env.WORKDIR }}
        run: |
          url=$(terraform output -raw app_url 2>/dev/null || true)
          [ -z "$url" ] && exit 0
          echo "app_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed infrastructure"
            echo "- App URL: $url"
            echo "- Dashboard: $(terraform output -raw cloudwatch_dashboard)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test hello-world
        if: steps.out.outputs.app_url != ''
        run: |
          url="${{ steps.out.outputs.app_url }}"
          for i in $(seq 1 30); do
            if curl -fsS "$url/api/health"; then echo; echo "healthy"; exit 0; fi
            echo "waiting for targets ($i/30)..."; sleep 20
          done
          echo "::error::$url/api/health did not become healthy"; exit 1
